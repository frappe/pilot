# ============================================================
# Python / Frappe
#
# Example:
#
# 2026-07-29 07:14:51,626 ERROR atlas finish_provisioning: failed: ...
# ============================================================

[PARSER]
    Name        pilot_python
    Format      regex

    Regex       /^(?<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) (?<level>[A-Z]+) (?<logger>\S+) (?<message>.*)/m

    Time_Key    time
    Time_Format %Y-%m-%d %H:%M:%S,%L
    Time_Keep   On


# ============================================================
# Python / Frappe multiline
# ============================================================

[MULTILINE_PARSER]
    Name          pilot_python_multiline
    Type          regex

    Flush_Timeout 1000

    Rule          "start_state" "/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} /" "cont"
    Rule          "cont"        "/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} /" "start_state"
    Rule          "cont"        "/^(?!\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} ).*/" "cont"


# ============================================================
# JSONL
# ============================================================

[PARSER]
    Name        pilot_json
    Format      json

    Time_Key    time
    Time_Keep   On


# ============================================================
# Nginx access
#
# 127.0.0.1 [21/Jul/2026:07:25:38 +0000]
# "GET /" 200 "139.59.87.142" 2.249
# ============================================================

[PARSER]
    Name        pilot_nginx_access
    Format      regex

    Regex       /^(?<client_ip>\S+) \[(?<time>[^\]]+)\] "(?<method>\S+) (?<path>[^"]*)" (?<status>\d{3}) "(?<upstream_ip>[^"]*)" (?<response_time>\S+)$/

    Time_Key    time
    Time_Format %d/%b/%Y:%H:%M:%S %z
    Time_Keep   On


# ============================================================
# Nginx error
# ============================================================

[PARSER]
    Name        pilot_nginx_error
    Format      regex

    Regex       /^(?<time>\d{4}\/\d{2}\/\d{2} \d{2}:\d{2}:\d{2}) \[(?<level>[^\]]+)\] (?<pid>\d+)#(?<tid>\d+):(?: \*(?<connection>\d+))? (?<message>.*)$/

    Time_Key    time
    Time_Format %Y/%m/%d %H:%M:%S
    Time_Keep   On


# ============================================================
# Redis
#
# Example:
#
# 15459:M 21 Jul 2026 07:20:39.665 * Running mode=standalone, port=13000.
#
# PID : role DATE TIME milliseconds level message
# ============================================================

[PARSER]
    Name        pilot_redis
    Format      regex

    Regex       /^(?<pid>\d+):(?<role>[A-Z]) (?<date>\d{2} \w{3} \d{4}) (?<time>\d{2}:\d{2}:\d{2}\.\d{3}) (?<level>[#*.-]) (?<message>.*)$/


# ============================================================
# Worker pool
#
# Examples:
#
# 07:20:42 Starting worker pool abc with pid 15463...
# 07:20:42 Worker abc: started with PID 15491, version 2.6.1
# 07:20:42 Worker abc: subscribing to channel rq:pubsub:abc
# 07:20:42 *** Listening on queue1, queue2...
# 07:21:17 Received SIGINT/SIGTERM, shutting down...
# ============================================================

[PARSER]
    Name        pilot_worker_pool
    Format      regex

    Regex       /^(?<time>\d{2}:\d{2}:\d{2}) (?<message>.*)$/

    Time_Key    time
    Time_Format %H:%M:%S
    Time_Keep   On