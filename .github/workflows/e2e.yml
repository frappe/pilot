name: System Package Transaction Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [before, after]
        repeat: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Benchmark package installation
        env:
          MODE: ${{ matrix.mode }}
        run: bash scripts/benchmark-package-transactions.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages-${{ matrix.mode }}-${{ matrix.repeat }}
          path: package-benchmark/
