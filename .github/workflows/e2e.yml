name: App Install Cache Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Setup Pilot
        run: |
          curl -fsSL https://raw.githubusercontent.com/frappe/pilot/develop/install.sh | sh
          export PATH="$HOME/pilot/bin:$HOME/.local/bin:$PATH"
          printf '%s\n' "$HOME/pilot/bin" "$HOME/.local/bin" >> "$GITHUB_PATH"
          pilot new cache-proof --frappe-branch develop
          pilot -b cache-proof init --commit 2d2094c252060a5c478eec0efe8dd904b52f985b
      - name: Start Pilot
        run: |
          pilot -b cache-proof start > "$RUNNER_TEMP/pilot.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:7000/api/v1/health
      - name: Probe stale module cache
        run: python scripts/probe-install-cache.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-install-cache-proof
          path: cache-proof-results/
