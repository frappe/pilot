name: Coverage comment

on:
  workflow_run:
    workflows: ["Unit Tests"]
    types: [completed]

jobs:
  comment:
    # Runs in the base repo context, so the token can comment on fork PRs too.
    # The test workflow never executes PR code here; only a Markdown artifact.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write

    steps:
      - name: Download coverage comment
        uses: actions/download-artifact@v8
        with:
          name: coverage-comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: coverage-artifact

      - name: Post coverage comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pilot-coverage-comment -->';
            const body = fs.readFileSync('coverage-artifact/coverage-comment.md', 'utf8');
            const run = context.payload.workflow_run;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
            });
            const pr = prs.find((p) => p.head.sha === run.head_sha);
            if (!pr) {
              core.warning('No open PR matches this run head SHA; skipping');
              return;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
