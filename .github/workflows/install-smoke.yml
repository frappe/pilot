name: Install Script Smoke Tests

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - install.sh
      - scripts/smoke_install.sh
      - scripts/smoke_install_macos.sh
      - .github/workflows/install-smoke.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint install.sh
        run: shellcheck -s sh install.sh

      - name: Lint smoke test script
        run: shellcheck scripts/smoke_install.sh

      - name: Lint macOS smoke test script
        run: shellcheck scripts/smoke_install_macos.sh

  smoke:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    needs: shellcheck
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:bookworm
          - ubuntu:24.04
          - fedora:latest
          - archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Run install.sh inside ${{ matrix.image }}
        run: ./scripts/smoke_install.sh "${{ matrix.image }}"

  smoke-macos:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    needs: shellcheck
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Run install.sh on macOS
        run: ./scripts/smoke_install_macos.sh
