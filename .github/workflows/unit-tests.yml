name: Unit Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  unit:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: sudo apt-get install -y redis-tools

      - name: Install dependencies
        run: pip install -e ".[test,admin,type-check]"

      - name: Run unit tests with coverage
        # e2e (Playwright, browser-driven) runs in its own workflow and needs a
        # live bench + browser, so keep it out of the unit run alongside integration.
        run: pytest tests/ --ignore=tests/integration --ignore=tests/e2e --cov=pilot --cov-report=term-missing --cov-report=xml:coverage.xml -q

      - name: Coverage comment
        if: github.event_name == 'pull_request'
        uses: orgoro/coverage@ca0c362dc1a4f100447309405e6dfea47e251495 # v3.3.1
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check (dev-only, see [tool.mypy] in pyproject.toml)
        run: mypy pilot admin/backend
