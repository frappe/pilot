name: Unit Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-22.04
    env:
      UV_COMPILE_BYTECODE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv pip install --system -e ".[test,admin]"

      - name: Run unit tests with coverage
        # e2e (Playwright, browser-driven) runs in its own workflow and needs a
        # live bench + browser, so keep it out of the unit run alongside integration.
        run: pytest tests/ -n auto --dist worksteal --ignore=tests/integration --ignore=tests/e2e --cov=pilot --cov-report=term-missing -q
        env:
          # sys.monitoring tracing is faster than the default C tracer on Python 3.12+.
          COVERAGE_CORE: sysmon

  lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Lint
        # Same ruff version as .pre-commit-config.yaml.
        run: uvx ruff@0.15.22 check admin pilot tests

      - name: Install dependencies
        run: uv pip install --system -e ".[admin,type-check]"

      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
          restore-keys: mypy-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-

      - name: Type check (dev-only, see [tool.mypy] in pyproject.toml)
        run: mypy pilot admin/backend
